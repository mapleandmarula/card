<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phil Maloney | Contact</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f4f5f7;
    }
    .card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
    h1 { margin: 0 0 4px; font-size: 1.35rem; color: #111; }
    p.title { margin: 0 0 20px; color: #555; font-size: 0.95rem; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 0;
      margin-bottom: 10px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    .btn-save { background: #0070f3; color: #fff; }
    .btn-secondary { background: #f0f2f5; color: #1f2937; }
    .btn-linkedin { background: #0a66c2; color: #fff; }
    .hint { font-size: 0.78rem; color: #777; margin: -4px 0 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Phil Maloney</h1>
    <p class="title">Enterprise Account Executive &bull; Dialogue</p>

    <!-- Save Contact Button -->
    <a href="contact.vcf" class="btn btn-save">Save Contact</a>
    <p class="hint">Tap <strong>Open</strong> when the file downloads to save</p>

    <!-- Direct Actions -->
    <a href="tel:+1 403 999 4494" class="btn btn-secondary">Call Mobile</a>
    <a href="mailto:philip.maloney@dialogue.co" class="btn btn-secondary">Send Email</a>
    <a href="https://www.linkedin.com/in/philmaloneycalgary/" class="btn btn-linkedin" target="_blank" rel="noopener">Connect on LinkedIn</a>
  </div>
</body>
</html>
